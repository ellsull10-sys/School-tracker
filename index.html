    function syncSubjectsWithTimetable(detectedSubs) {
      const specificMaths = ["Pre Mathematical Methods", "General Mathematics", "Numeracy", "Advanced Mathematics"];

      const hasSpecificHum = detectedSubs.some(s => specificHumanities.includes(s));

    async function handleTimetableImage(event, source) {
      const file = event.target.files[0];
      if (!file) return;
      pSnd('pop');

      const btn = source === 'ob' ? $('ob-scan-btn') : $('scan-tt-btn');
      const origText = btn.innerHTML;
      btn.innerHTML = '⏳ Reading Timetable (OCR)...';
      btn.style.opacity = '0.7';
      btn.style.pointerEvents = 'none';

      try {
        const worker = await Tesseract.createWorker('eng');
        const ret = await worker.recognize(file);
        await worker.terminate();

        const lines = ret.data.text.split('\n').map(l => l.trim()).filter(l => l.length > 0);
        const detectedCodes = [];
        const codeRegex = /\b([0-9]{1,2}[A-Z]{2,4}[0-9]?[A-Z0-9]?)\b/gi;

        lines.forEach(line => {
          const matches = line.match(codeRegex);
          if (matches) {
            matches.forEach(m => {
              const upperM = m.toUpperCase();
              if(mapCodeToSubject(upperM) !== 'Community Group') {
                detectedCodes.push(upperM);
              }
            });
          }
        });

        const daySlots = [0, 1, 2, 3, 4, 7, 8, 9, 10, 11];
        let codeIdx = 0;

        if (detectedCodes.length >= 10) {
          daySlots.forEach(d => {
            ttCyc[d] = [];
            for (let s = 0; s < 8; s++) {
              if (s === 0 || s === 7) {
                ttCyc[d].push('Community Group');
              } else {
                const rawCode = detectedCodes[codeIdx] || '';
                ttCyc[d].push(mapCodeToSubject(rawCode));
                codeIdx++;
              }
            }
          });
        }

        const ttSubs = [...new Set(Object.values(ttCyc).flat())];
        syncSubjectsWithTimetable(ttSubs);
        localStorage.setItem('org_ttcyc', JSON.stringify(ttCyc));

        pSnd('success');
        btn.innerHTML = '✅ Schedule Synchronized!';
        btn.style.background = 'var(--success)';
        btn.style.color = '#FFF';

        setTimeout(() => {
          btn.innerHTML = origText;
          btn.style.opacity = '1';
          btn.style.pointerEvents = 'all';
          btn.style.background = '';
          btn.style.color = '';

          if (source === 'ob') finishOnboarding();
          else { rendSet(); renderHome(false); alert("Simon Timetable Parsed!\n\nYour 10-day cycle and enrolled subjects have been updated."); }
        }, 1200);

      } catch (err) {
        console.error("OCR Parse Error: ", err);
        btn.innerHTML = origText;
        btn.style.opacity = '1';
        btn.style.pointerEvents = 'all';
        pSnd('tick');
        alert("Could not clearly read the timetable grid. Please ensure your screenshot is clear and uncropped, or enter subjects manually.");
      }
    }

    let aCtx;
    function pSnd(t) {
      if(!aCtx) aCtx = new (window.AudioContext || window.webkitAudioContext)(); if(aCtx.state === 'suspended') aCtx.resume();
      const o = aCtx.createOscillator(), g = aCtx.createGain(), n = aCtx.currentTime; o.connect(g); g.connect(aCtx.destination);
      if(t==='tick') { o.type='sine'; o.frequency.setValueAtTime(800,n); o.frequency.exponentialRampToValueAtTime(1400,n+.08); g.gain.setValueAtTime(.15,n); g.gain.exponentialRampToValueAtTime(.01,n+.08); o.start(); o.stop(n+.08); }
      else if(t==='pop') { o.type='triangle'; o.frequency.setValueAtTime(300,n); o.frequency.exponentialRampToValueAtTime(100,n+.12); g.gain.setValueAtTime(.2,n); g.gain.exponentialRampToValueAtTime(.01,n+.12); o.start(); o.stop(n+.12); }
      else if(t==='swoosh') { o.type='sine'; o.frequency.setValueAtTime(300,n); o.frequency.exponentialRampToValueAtTime(500,n+.12); g.gain.setValueAtTime(.1,n); g.gain.linearRampToValueAtTime(.01,n+.12); o.start(); o.stop(n+.12); }
      else if(t==='success') { o.type='sine'; o.frequency.setValueAtTime(523.25,n); o.frequency.setValueAtTime(659.25,n+.08); g.gain.setValueAtTime(.15,n); g.gain.linearRampToValueAtTime(.01,n+.25); o.start(); o.stop(n+.25); }
    }

          // Cloud is empty -> Push current local data up
          sDat();
          pSnd('success');

        }
        initCloudListener();
      }).catch(err => {
        console.error("Firebase read error:", err);
        $('sync-status').innerText = "🔴 Permission Denied";
        $('sync-status').style.color = "var(--critical)";
        alert("Sync Error: Firebase rejected the connection. Make sure your database Rules have .read and .write set to true!");

    function initCloudListener() {
      if(!syncActive || !db || !uData || !uData.syncPin) return;
      const pin = uData.syncPin;
      if($('sync-pin-input')) $('sync-pin-input').value = pin;

      const ref = db.ref('tracker/' + pin);
      ref.off(); // Remove duplicate listeners

      ref.on('value', snap => {
        const cloudData = snap.val();
        if(cloudData) {
          $('sync-status').innerText = "🟢 Synced (" + pin + ")";
          $('sync-status').style.color = "var(--success)";

          isIncomingSync = true;
          if(cloudData.sData) sData = cloudData.sData;
          if(cloudData.gNotes) gNotes = cloudData.gNotes;
          if(cloudData.dlData) dlData = cloudData.dlData;
          if(cloudData.ttCyc) ttCyc = cloudData.ttCyc;
          if(cloudData.ring) ring = cloudData.ring;
          
          localStorage.setItem('org_subjects', JSON.stringify(sData)); 
          localStorage.setItem('org_global', JSON.stringify(gNotes)); 
          localStorage.setItem('org_deadlines', JSON.stringify(dlData)); 
          localStorage.setItem('org_ring', JSON.stringify(ring));

          else if($('settings-screen').classList.contains('active')) rendSet();
          else renderHome(false);

          setTimeout(() => isIncomingSync = false, 500);
        }
      }, err => {
        console.error("Sync listener error:", err);
        $('sync-status').innerText = "🔴 Rule Error";
        $('sync-status').style.color = "var(--critical)";

      if(tt) {
        ts.innerHTML = `<h2>Today's Schedule</h2><div class="horizontal-scroll" style="margin-bottom: 20px;">${tt.map((cN, i) => { 
          const m = sData.find(s => s.name.toLowerCase() === cN.toLowerCase()); 
          const iS = sLab[i].includes('Session'); 
          let hwText = '';
          if (m && m.homework && m.homework.length > 0) {
            const upc = [...m.homework].sort((a,b) => new Date(a.date) - new Date(b.date))[0];
            const d = gDD(upc.date);
            let sC = 'var(--text-secondary)';
            let txt = `Homework task due in ${d} days`;
            if (d < 0) { txt = 'Homework overdue!'; sC = 'var(--critical)'; }
            else if (d === 0) { txt = 'Homework due today'; sC = 'var(--warning)'; }
            else if (d === 1) { txt = 'Homework due in 1 day'; }
            hwText = `<div style="font-size:11px; margin-top:6px; font-weight:600; color:${sC}; line-height:1.2;">${txt}</div>`;
          }
          return `<div class="timetable-card app-card" data-tt-sub="${m?m.id:''}" style="background-color: ${m?stD[m.status].c:(iS?'rgba(0,0,0,0.03)':'var(--card-bg)')}; border-color: ${m?stD[m.status].h:'var(--card-border)'};" ${m?`onclick="openDet('${m.id}')"`:''}><div class="tt-session">${sLab[i]}</div><div class="tt-subject">${cN}</div>${hwText}</div>`; 
        }).join('')}</div>`;
      } else {
        ts.innerHTML = `<h2>Today's Schedule</h2><div class="app-card" style="padding: 24px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; margin-bottom: 20px;"><span style="font-size: 28px;">🎉</span><span style="font-weight: 600; color: var(--text-secondary); text-align: center;">It's the weekend!<br>No classes scheduled today.</span></div>`;
      }

      sData.sort((a, b) => a.status - b.status);
      $('subjects-list').innerHTML = sData.map((s, i) => `<div class="card app-card ${a}" data-id="${s.id}" style="background-color: ${stD[s.status].c}; border-color: ${stD[s.status].h}; animation-delay: ${0.28 + (0.04*i)}s; z-index: ${100-i};" onclick="openDet('${s.id}')"><div class="boxes-container">${[0,1,2,3,4].map(j => `<div class="box ${s.status===j?'active':''}" style="--box-color: ${stD[j].h};" onclick="event.stopPropagation(); setSt('${s.id}', ${j})"></div>`).join('')}</div><div class="subject-title">${s.name}</div></div>`).join('');
      $('global-notes-list').innerHTML = gNotes.map((n, i) => `<div id="global-item-${n.id}" class="list-item app-card task-card ${a} ${isOD(n.date)?'overdue':''}" style="animation-delay: ${0.40 + (0.04*i)}s;"><div><div style="font-weight: 600; font-size: 15px;">${n.text}</div><div class="date-badge">Due: ${fmtD(n.date)}</div></div><button class="delete-btn" onclick="compGAnim('${n.id}')">×</button></div>`).join('');
    }

    function processPhoto(e) { const f = e.target.files[0]; if(!f) return; pSnd('pop'); const r = new FileReader(); r.onload = ev => { const img = new Image(); img.onload = () => { const c = document.createElement('canvas'); const s = Math.min(600/img.width, 1); c.width = img.width*s; c.height = img.height*s; c.getContext('2d').drawImage(img,0,0,c.width,c.height); getSub(cSubId).photos.push({ id: Date.now().toString(), img: c.toDataURL('image/jpeg', 0.5) }); sDat(); renderDet(); }; img.src = ev.target.result; }; r.readAsDataURL(f); }
    function delPhoto(id) { pSnd('tick'); getSub(cSubId).photos = getSub(cSubId).photos.filter(p => p.id !== id); sDat(); renderDet(); }

    function animRO(id) {
      const list = $('subjects-list'); const crd = Array.from(list.children);
      crd.forEach(c => { c.style.animation='none'; c.classList.remove('cascade-item'); });
      const pos = {}; crd.forEach(c => pos[c.dataset.id] = c.getBoundingClientRect().top);
      sData.sort((a,b) => a.status - b.status);
      
      sData.forEach((s, idx) => { 
        const c = list.querySelector(`.card[data-id="${s.id}"]`); 
        if(c) { 
          list.appendChild(c); 
          c.style.backgroundColor=stD[s.status].c; 
          c.style.borderColor=stD[s.status].h; 
          c.querySelectorAll('.box').forEach((b,i)=>{ b.classList.toggle('active', i===s.status); }); 
          c.dataset.tZ = 100-idx; 
        } 
      });
      
      Array.from(list.children).forEach(c => {
        const dY = pos[c.dataset.id] - c.getBoundingClientRect().top;
        if(dY !== 0) {
          c.style.transition='none'; 
          c.style.transform=`translate3d(0, ${dY}px, 0)`; 
          requestAnimationFrame(() => requestAnimationFrame(() => {
            c.style.transition='transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1)'; 
            c.style.transform=`translate3d(0, 0, 0)`; 
            setTimeout(() => { c.style.transition=''; c.style.zIndex=c.dataset.tZ; }, 500); 
          }));
        } else {
          c.style.zIndex = c.dataset.tZ;
        }
      });
    }

    function setSt(id, idx) { 
      pSnd('tick'); getSub(id).status = idx; sDat(); 
      if(!cSubId) { 
        animRO(id); $$(`.timetable-card[data-tt-sub="${id}"]`).forEach(c => { c.style.backgroundColor = stD[idx].c; c.style.borderColor = stD[idx].h; c.style.transform = 'scale(1.04)'; setTimeout(() => c.style.transform='', 200); });
      } else { 
        $$('.status-row').forEach((r,i) => { const b = r.querySelector('.box'); if(i===idx) { r.classList.add('active-status'); b.classList.add('active'); r.style.setProperty('--status-bg', stD[i].c); r.style.setProperty('--box-color', stD[i].h); b.style.setProperty('--box-color', stD[i].h); } else { r.classList.remove('active-status'); b.classList.remove('active'); } }); 
      } updHUI();
    }

    function openSc(id) { 
      pSnd('swoosh'); 
      $$('.screen').forEach(s => { s.classList.remove('active'); void s.offsetWidth; }); 
      const scr = $(id); 
      scr.classList.add('active'); 
      window.scrollTo(0,0); 
      if(id === 'settings-screen') { appSetApply(); rendSet(); } 
    }
    
    function openDet(id) { cSubId = id; renderDet(); openSc('detail-screen'); }
    function goHome() { cSubId = null; sData.sort((a,b) => a.status - b.status); renderHome(true); openSc('home-screen'); }

    function renderDet(isUpdate = false) {
      const s = getSub(cSubId);
      $('detail-title').innerText = s.name; $('subject-notes').value = s.notes;
      
      if(!isUpdate) {
        $('detail-statuses').innerHTML = stD.map((st, i) => `<div class="status-row app-card cascade-item" style="--status-bg: ${st.c}; --box-color: ${st.h}; animation-delay: ${0.05 + (0.03*i)}s;" onclick="setSt('${s.id}', ${i})"><div class="box ${s.status===i?'active':''}" style="--box-color: ${st.h};"></div><div class="status-label">${st.l}</div></div>`).join('');
      }
      
      const pG = $('photo-gallery'); if(s.photos.length>0) { pG.style.display='flex'; pG.innerHTML = s.photos.map(p => `<div class="photo-card cascade-item" style="animation-delay: 0.15s; background-image: url('${p.img}')"><button class="del-photo" onclick="delPhoto('${p.id}')">×</button></div>`).join(''); } else { pG.style.display='none'; pG.innerHTML=''; }
      let tS=0, tO=0; $('grades-list').innerHTML = s.grades.map((g,i) => { tS+=parseFloat(g.score); tO+=parseFloat(g.outOf); return `<div class="list-item app-card cascade-item" style="animation-delay:${0.40 + (0.04*i)}s;"><div><div style="font-weight: 600;">${g.name}</div><div class="date-badge">${g.score} / ${g.outOf}</div></div><div style="display:flex; align-items:center; gap: 8px;"><div class="grade-badge">${Math.round((g.score/g.outOf)*100)}%</div><button class="delete-btn" onclick="delGrade('${g.id}')">×</button></div></div>`; }).join('');
      $('average-banner').innerText = tO>0 ? `Current Average: ${Math.round((tS/tO)*100)}%` : "No Grades Logged";
      $('hw-list').innerHTML = s.homework.map((hw,i) => `<div id="hw-item-${hw.id}" class="list-item app-card task-card cascade-item ${isOD(hw.date)?'overdue':''}" style="animation-delay:${0.25 + (0.04*i)}s;"><div><div style="font-weight: 600; font-size: 15px;">${hw.text}</div><div class="date-badge">Due: ${fmtD(hw.date)}</div></div><button class="delete-btn" onclick="compHWAnim('${hw.id}')">×</button></div>`).join('');
    }

    function perfC(el, cb) { pSnd('success'); el.style.transition='all 0.3s ease'; el.style.background='var(--success)'; el.style.transform='scale(0.96) translateX(15px)'; const d=el.querySelector('div>div:first-child'), b=el.querySelector('.date-badge'), x=el.querySelector('.delete-btn'); if(d) d.style.color='#FFF'; if(b) b.style.color='rgba(255,255,255,0.85)'; if(x) { x.innerHTML='✓'; x.style.color='#FFF'; x.style.transform='scale(1.1)'; } setTimeout(()=>{ el.style.transition='all 0.4s cubic-bezier(0.16,1,0.3,1)'; el.style.transform='scale(0.9) translateX(30px)'; el.style.opacity='0'; el.style.maxHeight=el.offsetHeight+'px'; requestAnimationFrame(()=>{ el.style.maxHeight='0px';el.style.paddingTop='0';el.style.paddingBottom='0';el.style.marginBottom='0';el.style.borderWidth='0'; }); setTimeout(cb, 380); }, 300); }
    function compGAnim(id) { const el=$(`global-item-${id}`); if(el) perfC(el,()=>delGN(id)); else delGN(id); }
    function compHWAnim(id) { const el=$(`hw-item-${id}`); if(el) perfC(el,()=>delHW(id)); else delHW(id); }

    function delGN(id) { addRSc(); gNotes = gNotes.filter(n => n.id !== id); sDat(); renderHome(false); }
    function delHW(id) { addRSc(); getSub(cSubId).homework = getSub(cSubId).homework.filter(h => h.id !== id); sDat(); const el=$(`hw-item-${id}`); if(el) el.remove(); }
    
    function addGrade() { pSnd('pop'); const n=$('grade-name'),s=$('grade-score'),o=$('grade-out-of'); if(!n.value||!s.value||!o.value) return; getSub(cSubId).grades.push({ id: Date.now().toString(), name: n.value, score: s.value, outOf: o.value }); n.value=''; s.value=''; o.value=''; sDat(); renderDet(true); }
    function delGrade(id) { pSnd('tick'); getSub(cSubId).grades = getSub(cSubId).grades.filter(g => g.id !== id); sDat(); renderDet(true); }
    function addHW() { pSnd('pop'); const d=$('hw-desc'), dt=$('hw-date'); if(!d.value||!dt.value) return; getSub(cSubId).homework.push({ id: Date.now().toString(), text: d.value, date: dt.value }); d.value=''; dt.value=''; sDat(); renderDet(true); }
    function addGN() { pSnd('pop'); const t=$('global-task'),d=$('global-date'); if(!t.value||!d.value) return; gNotes.push({ id: Date.now().toString(), text: t.value, date: d.value }); t.value=''; d.value=''; sDat(); renderHome(false); }
    function saveNotes() { getSub(cSubId).notes = $('subject-notes').value; sDat(); }
    function addDL() { pSnd('pop'); const n=$('dl-name'), d=$('dl-date'); if(!n.value||!d.value) return; dlData.push({ id: Date.now().toString(), name: n.value, date: d.value }); n.value=''; d.value=''; sDat(); renderHome(false); alert("Deadline Added!"); }
    function delDL(id) { pSnd('tick'); dlData = dlData.filter(d => d.id !== id); sDat(); renderHome(false); }

    let tI; let tL = 25*60; let isR = false; const pI = `<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>`, psI = `<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></svg>`;
    function toggleTmr() { const w = $('timer-icon'), r = $('timer-progress'); pSnd('tick'); if(isR){ clearInterval(tI); isR=false; w.innerHTML=pI; } else { isR=true; w.innerHTML=psI; tI=setInterval(()=>{ tL--; let m=Math.floor(tL/60),s=tL%60; $('timer-display').innerText=`${m}:${s<10?'0':''}${s}`; r.style.strokeDasharray=`${(tL/(25*60))*100}, 100`; if(tL<=0){ clearInterval(tI); isR=false; w.innerHTML=pI; tL=25*60; r.style.strokeDasharray=`100, 100`; $('timer-display').innerText=`25:00`; pSnd('success'); addRSc(); alert("Focus complete!"); } }, 1000); } }

    function renameSub(id) {
      pSnd('pop');
      const sub = getSub(id);
      const oldName = sub.name;
      const newName = prompt("Rename subject:", oldName);
      
      if(newName && newName.trim() !== "" && newName.trim() !== oldName) {
        const finalName = newName.trim();
        sub.name = finalName;
        
        for (let day in ttCyc) {
          ttCyc[day] = ttCyc[day].map(subjectName => 
            (subjectName === oldName) ? finalName : subjectName
          );
        }
        
        localStorage.setItem('org_ttcyc', JSON.stringify(ttCyc));
        sDat();
        rendSet();
        
        if(!$('detail-screen').classList.contains('active')){
          renderHome(false);
        }
      }
    }

    function rendSet() { 
      $('settings-subjects-list').innerHTML = sData.map((s,i) => `
        <div class="list-item app-card cascade-item" style="animation-delay: ${0.20 + (i*0.04)}s;">
          <div style="font-weight: 500; flex: 1; cursor: pointer; padding-right: 12px;" onclick="renameSub('${s.id}')">
            ${s.name} <span style="font-size:12px; color:var(--text-secondary); margin-left: 4px;">✎</span>
          </div>
          <button class="delete-btn" onclick="delSub('${s.id}')">×</button>
        </div>
      `).join(''); 
    }
    
    function addSub() { pSnd('pop'); const i=$('new-subject'); if(!i.value)return; sData.push({ id: Date.now().toString(), name: i.value, status: 2, homework: [], notes: "", grades: [], photos: []}); i.value=''; sDat(); rendSet(); }
    function delSub(id) { pSnd('tick'); if(confirm("Delete subject?")) { sData = sData.filter(s => s.id !== id); sDat(); rendSet(); } }
  </script>
